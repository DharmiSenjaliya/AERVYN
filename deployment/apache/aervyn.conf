# AERVYN: ECHOES OF TIME - Apache 2.4 Production VirtualHost Configuration

<VirtualHost *:80>
    ServerName your-game-domain.com
    Redirect permanent / https://your-game-domain.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName your-game-domain.com
    DocumentRoot /var/www/aervyn/frontend/dist

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/your-game-domain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/your-game-domain.com/privkey.pem

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    # Frontend Single Page Application Routing
    <Directory /var/www/aervyn/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.html [L]
    </Directory>

    # Backend API Alias Routing (Laravel)
    Alias /api /var/www/aervyn/backend/public
    <Directory /var/www/aervyn/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
