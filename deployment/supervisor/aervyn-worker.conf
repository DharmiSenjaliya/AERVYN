# AERVYN: ECHOES OF TIME - Supervisor Queue Worker Configuration
# Place in /etc/supervisor/conf.d/aervyn-worker.conf

[program:aervyn-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/aervyn/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/aervyn/backend/storage/logs/worker.log
stopwaitsecs=3600
