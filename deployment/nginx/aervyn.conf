# AERVYN: ECHOES OF TIME - Nginx Production Server Configuration
# Place in /etc/nginx/sites-available/aervyn.conf and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name your-game-domain.com www.your-game-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-game-domain.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your-game-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-game-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Single-Page Application (Vite Build)
    root /var/www/aervyn/frontend/dist;
    index index.html;

    # Gzip Compression for 3D Shaders & Bundles
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Media & Uploads Direct Serving
    location /uploads/ {
        alias /var/www/aervyn/backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Backend REST API Routing (Laravel 12)
    location /api {
        alias /var/www/aervyn/backend/public;
        try_files $uri $uri/ @backend;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/aervyn/backend/public/index.php;
            fastcgi_read_timeout 60;
        }
    }

    location @backend {
        rewrite /api/(.*)$ /api/index.php?/$1 last;
    }

    # Deny access to sensitive hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
